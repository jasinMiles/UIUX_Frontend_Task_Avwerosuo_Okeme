<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — DroneTV</title>
<meta name="description" content="Log in to your DroneTV dashboard.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-shell">
  <div class="auth-card">
    <a href="index.html" class="auth-brand">DroneTV<span class="dot">.</span></a>
    <h1>Welcome back</h1>
    <p>Access your DroneTV dashboard.</p>

    <form id="login-form" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" autocomplete="email">
        <p class="error-msg" id="email-error"></p>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password">
        <p class="error-msg" id="password-error"></p>
      </div>
      <div class="field-row">
        <label class="checkbox">
          <input type="checkbox" id="remember" name="remember">
          Remember me
        </label>
        <a href="#">Forgot password?</a>
      </div>
      <button type="submit" class="btn btn--primary btn--block">Log in</button>
      <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
    </form>

    <p class="auth-footer">Don't have an account? <a href="#">Create account</a></p>
  </div>
</div>

<script src="js/script.js"></script>
</body>
</html>
